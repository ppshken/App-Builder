name: ${COMPOSE_PROJECT_NAME:-nocode}
services:
  app:
    image: ${APP_IMAGE:-nocode-builder:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: Asia/Bangkok
      NOCODE_DB_PATH: /data/data.db
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=1024}
      NOCODE_WEBHOOK_ORIGINS: ${NOCODE_WEBHOOK_ORIGINS:-}
    expose:
      - "3000"
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0750
    shm_size: 256mb
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app_data:
  caddy_data:
  caddy_config:
